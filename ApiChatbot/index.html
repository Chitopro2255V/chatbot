<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure AI Chatbot - Netlify</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .header p { margin: 5px 0 0; font-size: 0.85rem; opacity: 0.9; }
        .status-bar {
            background: #e8f0fe;
            padding: 10px 20px;
            font-size: 0.85rem;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .status-badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
        }
        .chat-area {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        .message { margin-bottom: 16px; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message { text-align: right; }
        .ai-message { text-align: left; }
        .message-bubble {
            display: inline-block;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .user-message .message-bubble {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-message .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .message-label { font-size: 0.7rem; margin-bottom: 4px; opacity: 0.7; }
        .typing-indicator {
            display: inline-block;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            border: 1px solid #ddd;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
        }
        .input-area input:focus { border-color: #1a73e8; }
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .input-area button:disabled { opacity: 0.6; cursor: not-allowed; }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.7rem;
            color: #666;
            background: white;
            border-top: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Secure AI Chatbot</h1>
            <p>API key is hidden on Netlify's server</p>
        </div>
        
        <div class="status-bar">
            <div class="status-text">
                <span class="status-badge"></span>
                <span id="statusMessage">✅ Ready to chat!</span>
            </div>
            <div class="model-info">
                🔒 API key hidden | ⚡ Gemini 2.5 Flash
            </div>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="ai-message">
                <div class="message-label">🤖 Assistant</div>
                <div class="message-bubble">
                    Hi! My API key is safely stored on Netlify's server.<br><br>
                    Ask me anything! 🚀
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask anything...">
            <button id="sendBtn">Send</button>
            <button id="clearBtn" style="background:#f0f0f0;color:#666;">Clear</button>
        </div>
        
        <div class="footer">
            🔒 Your API key never leaves Netlify's servers | Secure deployment
        </div>
    </div>

    <script>
        let conversationHistory = [];
        
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role === 'user' ? 'user-message' : 'ai-message'}`;
            
            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = role === 'user' ? '👤 You' : '🤖 Assistant';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;
            
            messageDiv.appendChild(label);
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message ai-message';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="message-label">🤖 Assistant</div>
                <div class="typing-indicator"><span></span><span></span><span></span></div>
            `;
            chatArea.appendChild(indicator);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }
        
        async function sendMessage() {
            const userText = userInput.value.trim();
            if (!userText) return;
    
            addMessage('user', userText);
            userInput.value = '';
            sendBtn.disabled = true;
    
            conversationHistory.push({ role: "user", parts: [{ text: userText }] });
    
            try {
                showTypingIndicator();
                
                console.log("Sending request to Netlify function...");
                
                const response = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory })
                });
                
                console.log("Response status:", response.status);
                
                // First check if response is ok
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Error response:", errorText);
                    let errorMessage = `HTTP ${response.status}`;
                    try {
                        const errorJson = JSON.parse(errorText);
                        errorMessage = errorJson.error || errorJson.message || errorMessage;
                    } catch(e) {
                        errorMessage = errorText || errorMessage;
                    }
                    removeTypingIndicator();
                    addMessage('ai', `❌ Server error: ${errorMessage}`);
                    return;
                }
                
                // Parse the JSON response
                let data;
                try {
                    const responseText = await response.text();
                    console.log("Response text:", responseText.substring(0, 200));
                    data = JSON.parse(responseText);
                } catch (e) {
                    console.error("Failed to parse response as JSON:", e);
                    removeTypingIndicator();
                    addMessage('ai', `❌ Failed to parse server response. The function may not be deployed correctly.`);
                    return;
                }
                
                removeTypingIndicator();
                
                if (data.error) {
                    addMessage('ai', `❌ API Error: ${data.error}`);
                    return;
                }
                
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!reply) {
                    addMessage('ai', `❌ No response from AI. Response structure: ${JSON.stringify(data).substring(0, 200)}`);
                    return;
                }
                
                addMessage('ai', reply);
                conversationHistory.push({ role: "model", parts: [{ text: reply }] });
                
                if (conversationHistory.length > 20) {
                    conversationHistory = conversationHistory.slice(-20);
                }
                
            } catch (error) {
                removeTypingIndicator();
                console.error('Network Error:', error);
                addMessage('ai', `❌ Network error: ${error.message}. Make sure your Netlify function is deployed correctly.`);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
        
        function clearConversation() {
            conversationHistory = [];
            chatArea.innerHTML = '';
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'message ai-message';
            welcomeDiv.innerHTML = `
                <div class="message-label">🤖 Assistant</div>
                <div class="message-bubble">✨ Conversation cleared! Ask me anything.</div>
            `;
            chatArea.appendChild(welcomeDiv);
        }
        
        sendBtn.addEventListener('click', sendMessage);
        clearBtn.addEventListener('click', clearConversation);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
